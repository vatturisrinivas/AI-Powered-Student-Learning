spring.application.name=AI-Powered-Student-Learning

spring.datasource.url=jdbc:mysql://localhost:3306/studentProject
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# AI provider secret stays on backend, never in Vite environment
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
